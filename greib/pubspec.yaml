name: greib_menk
description: "گريب منك - تطبيق إماراتي متكامل يدمج خدمات متعددة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.15
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  http: ^1.2.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  flutter_localizations:
    sdk: flutter
  record: ^7.1.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.0
  image_picker: ^1.1.0
  permission_handler: ^11.3.0
  share_plus: ^10.1.2
  file_picker: ^8.0.0
  go_router: ^18.0.1
  # ── منظومة الخرائط الحقيقية (مجانية 100% بدون API Key) ──
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.4
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/geo/
    # ── أيقونات Filled Lucide (النسخة الممتلئة لشريط التنقل) ──
    - assets/icons/filled/